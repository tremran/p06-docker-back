services:

  app:
    image: workshop-organizer
    env_file: "./app.env"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: postgres:13
    env_file: "./app.env"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p $$POSTGRES_PORT"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  db-data: