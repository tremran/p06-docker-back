name: ci

on:
  push:
    branches:
      - develop
      - ci-tests

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set env for back repository
        if: ${{ github.repository == 'tremran/p06-docker-back' }}
        run: |
          echo "CI_COVERAGE_FOLDER=build/test-results/test/" >> "$GITHUB_ENV"
          echo "CI_TEST_FOLDER=test-results" >> "$GITHUB_ENV"

      - name: Set env for front repository
        if: ${{ github.repository == 'tremran/p06-docker-front' }}
        run: |
          echo "CI_COVERAGE_FOLDER=coverage/olympic-games-starter/" >> "$GITHUB_ENV"
          echo "CI_TEST_FOLDER=test-results" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: ${{ github.repository == 'tremran/p06-docker-back' }}
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        if: ${{ github.repository == 'tremran/p06-docker-front' }}
        with:
          node-version: '20'
          cache: npm

      - run: ./run-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ${{ env.CI_TEST_FOLDER }}

  build:
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
